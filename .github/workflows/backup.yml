name: 🔄 Database Backup Automático

on:
  schedule:
    # Rodar todo dia às 3AM (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Instalar dependências
        run: npm install pg

      - name: 💾 Fazer backup automático do banco
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Atualizar backup-auto.js com DATABASE_URL do secret
          sed -i "s|const DATABASE_URL = '.*'|const DATABASE_URL = '${{ secrets.DATABASE_URL }}'|g" backup-auto.js
          node backup-auto.js

      - name: 📤 Commit backup para repositório
        run: |
          git config user.name "🤖 Backup Bot"
          git config user.email "backup@powerhub.local"
          git add backups/
          git commit -m "🔄 Backup automático: $(date +%Y-%m-%d)" || echo "Nenhum backup novo"
          git push origin main

      - name: ✅ Backup concluído
        run: echo "✅ Backup automático completado com sucesso!"
